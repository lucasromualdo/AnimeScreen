name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    env:
      PROJECT_PATH: src\MyAnimeScreen.App\MyAnimeScreen.App.vbproj
      PUBLISH_DIR: artifacts\publish\MyAnimeScreen\win-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MyAnimeScreen.slnx

      - name: Build
        run: dotnet build MyAnimeScreen.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MyAnimeScreen.slnx --configuration Release --no-build

      - name: Publish (win-x64 self-contained)
        run: dotnet publish $env:PROJECT_PATH /p:PublishProfile=Release-win-x64-selfcontained
        shell: pwsh

      - name: Package Zip
        id: package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipPath = "artifacts\publish\MyAnimeScreen-$tag-win-x64-selfcontained.zip"

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path "$env:PUBLISH_DIR\*" -DestinationPath $zipPath -CompressionLevel Optimal

          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build Release Notes from CHANGELOG
        id: notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $notesPath = "artifacts\publish\release-notes-$tag.md"

          $changelogPath = "CHANGELOG.md"
          if (-not (Test-Path $changelogPath)) {
            "# $tag`n`nRelease automatizada." | Set-Content -Path $notesPath -Encoding utf8
            "notes_path=$notesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $lines = Get-Content $changelogPath
          $startHeader = "## [$version]"
          $startIndex = -1

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith($startHeader)) {
              $startIndex = $i
              break
            }
          }

          if ($startIndex -lt 0) {
            "# $tag`n`nRelease automatizada (`$version`)." | Set-Content -Path $notesPath -Encoding utf8
            "notes_path=$notesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $endIndex = $lines.Count
          for ($i = $startIndex + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith("## [")) {
              $endIndex = $i
              break
            }
          }

          $section = @()
          for ($i = $startIndex; $i -lt $endIndex; $i++) {
            $section += $lines[$i]
          }

          $extra = @(
            ""
            "## Download"
            "- `MyAnimeScreen-$tag-win-x64-selfcontained.zip` (Windows x64, self-contained)"
            "- Extraia o `.zip` e execute `MyAnimeScreen.App.exe`"
          )

          ($section + $extra) | Set-Content -Path $notesPath -Encoding utf8
          "notes_path=$notesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create or Update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zipPath = "${{ steps.package.outputs.zip_path }}"
          $notesPath = "${{ steps.notes.outputs.notes_path }}"

          gh release view $tag | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zipPath --clobber
            gh release edit $tag --title $tag --notes-file $notesPath
            exit 0
          }

          gh release create $tag $zipPath --title $tag --notes-file $notesPath
